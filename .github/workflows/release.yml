# Builds CameraBusinessUse.exe and publishes it as a GitHub Release when a v* tag is
# pushed. The tag must equal v<__version__> from camera_business_use/__init__.py.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # re-run for an existing tag: gh workflow run release.yml --ref v1.0.1

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash  # Git Bash waits for the windowed exe and passes its exit code on
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Version and tag
        run: |
          version=$(python -c "import camera_business_use; print(camera_business_use.__version__)")
          tag="$GITHUB_REF_NAME"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match __version__ $version. Run this for a tag v$version."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Delete it first to publish it again."
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Engine tests
        run: python -m unittest discover -s tests

      - name: Build
        run: python scripts/build.py

      - name: Smoke test the exe
        run: dist/CameraBusinessUse.exe --selftest

      - uses: actions/upload-artifact@v7
        with:
          name: CameraBusinessUse-${{ env.TAG }}
          path: dist/CameraBusinessUse.exe
          if-no-files-found: error

      - name: Publish release
        run: gh release create "$TAG" dist/CameraBusinessUse.exe --verify-tag --title "$TAG" --generate-notes
